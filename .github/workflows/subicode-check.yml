name: SubiCode source checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Canonical lint and types
        run: bun run check
      - name: E2E TypeScript
        working-directory: packages/app
        run: bun run typecheck:e2e
      - name: App unit tests
        working-directory: packages/app
        run: bun run test:unit
      - name: Desktop packaging contracts
        working-directory: packages/desktop
        run: bun test scripts/distribution-packages.test.ts scripts/subi-distribution.test.ts
      - name: CLI MCP commands
        working-directory: packages/cli
        run: bun test --timeout 60000 test/mcp-auth-choices.test.ts
