name: SubiCode native packages

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: Explicit SubiCode build version
        required: true
        default: 2.0.1
      qualification_run_id:
        description: Requalify existing native artifacts from this run instead of rebuilding
        required: false
        default: ""
      publish_run_id:
        description: Publish qualified public download artifacts from this completed run
        required: false
        default: ""
      publish_extra_run_id:
        description: Optional requalification run supplying additional downloads for the same built source
        required: false
        default: ""
      publish_platforms:
        description: Comma-separated qualified desktop targets to publish (blank means all six)
        required: false
        default: ""
      desktop_only:
        description: Qualify and publish desktop independently of VS Code extension-host completion
        type: boolean
        required: false
        default: false
      windows_x64_only:
        description: Requalify only the Windows x64 candidate
        type: boolean
        required: false
        default: false
      posix_only:
        description: Requalify macOS and Linux targets only
        type: boolean
        required: false
        default: false
      macos_only:
        description: Requalify macOS targets only
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.publish_run_id && 'publish' || inputs.qualification_run_id || 'qualify' }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ !inputs.publish_run_id }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_x64_only && '[{"platform":"win32-x64","runner":"windows-2025"}]' || inputs.macos_only && '[{"platform":"darwin-x64","runner":"macos-15-intel"},{"platform":"darwin-arm64","runner":"macos-15"}]' || inputs.posix_only && '[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"darwin-x64","runner":"macos-15-intel"},{"platform":"darwin-arm64","runner":"macos-15"}]' || '[{"platform":"win32-x64","runner":"windows-2025"},{"platform":"win32-arm64","runner":"windows-11-arm"},{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"darwin-x64","runner":"macos-15-intel"},{"platform":"darwin-arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_VERSION: ${{ inputs.version || '2.0.1' }}
      OPENCODE_CHANNEL: prod
      SUBICODE_OUTPUT: artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}
      # Desktop artifacts remain unsigned. npm publication is a separate, manual, qualified step.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Install extension dependencies
        working-directory: sdks/vscode
        run: bun install --frozen-lockfile
      - name: Verify packaging contracts
        working-directory: packages/desktop
        run: bun test scripts/distribution-packages.test.ts scripts/subi-distribution.test.ts
      - name: Install Linux desktop packaging and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential rpm xvfb libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64
          sudo gem install fpm --no-document
          echo 'USE_SYSTEM_FPM=true' >> "$GITHUB_ENV"
      - name: Build native CLI, VSIX and desktop packages
        if: ${{ !inputs.qualification_run_id }}
        run: bun run packages/desktop/scripts/distribute.ts
      - name: Download existing native candidate
        if: ${{ inputs.qualification_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.qualification_run_id }}" --repo "$GITHUB_REPOSITORY" --name "subicode-${{ matrix.platform }}" --dir "$SUBICODE_OUTPUT"
      - name: Restore executable permissions after artifact download
        if: ${{ inputs.qualification_run_id && runner.os != 'Windows' }}
        run: |
          chmod +x "$SUBICODE_OUTPUT/packages/cli/bin/subi"
          find "$SUBICODE_OUTPUT/desktop" -type f \( -path '*/Contents/MacOS/*' -o -name 'opencode-cli' -o -name 'spawn-helper' -o -name 'chrome_crashpad_handler' -o -name 'chrome-sandbox' -o -name 'in.stlearnsmart.subi.desktop' \) -exec chmod +x {} +
      - name: Save npm candidates and qualification
        if: ${{ always() && !inputs.qualification_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: subicode-npm-${{ matrix.platform }}
          path: |
            artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/subicodeagent-subi-cli*.tgz
            artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/packages/qualification.json
          if-no-files-found: error
          retention-days: 14
      - name: Compile extension-host qualification
        working-directory: sdks/vscode
        run: bun run compile-tests
      - name: Qualify packaged desktop and extension on Linux
        if: runner.os == 'Linux'
        continue-on-error: ${{ inputs.desktop_only }}
        timeout-minutes: 12
        run: xvfb-run -a node packages/desktop/scripts/qualify-distribution.mjs "$SUBICODE_OUTPUT"
      - name: Qualify packaged desktop and extension on Windows and macOS
        if: runner.os != 'Linux'
        continue-on-error: ${{ inputs.desktop_only }}
        timeout-minutes: 12
        run: node packages/desktop/scripts/qualify-distribution.mjs "$SUBICODE_OUTPUT"
      - name: Save packages and qualification status
        if: ${{ always() && !inputs.qualification_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: subicode-${{ matrix.platform }}
          path: artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
      - name: Save native qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subicode-qualification-${{ matrix.platform }}
          path: |
            artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/packages/qualification.json
            artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/desktop-qualification.png
            artifacts/platforms/${{ inputs.version || '2.0.1' }}/${{ matrix.platform }}/vscode-logs/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare qualified public download files
        run: node script/prepare-desktop-downloads.mjs "$SUBICODE_OUTPUT" "artifacts/downloads/${{ matrix.platform }}" ${{ inputs.desktop_only && '--desktop-only' || '' }}
      - name: Save qualified public download files
        uses: actions/upload-artifact@v4
        with:
          name: subicode-downloads-${{ matrix.platform }}
          path: artifacts/downloads/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SUBICODE_DESKTOP_PLATFORMS: ${{ inputs.publish_platforms }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download qualified desktop and extension releases
        run: gh run download "${{ inputs.publish_run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'subicode-downloads-*' --dir artifacts/downloads
      - name: Download additional qualified targets
        if: ${{ inputs.publish_extra_run_id }}
        run: gh run download "${{ inputs.publish_extra_run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'subicode-downloads-*' --dir artifacts/downloads
      - name: Verify all six platforms and publish release files
        run: node script/publish-subicode-desktop.mjs artifacts/downloads --publish ${{ inputs.desktop_only && '--desktop-only' || '' }}
